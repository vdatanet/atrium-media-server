# The request cases: what a differential run actually sends, per endpoint and per identity.
#
# Read with specs/010-conformance-harness/spec.md sections 3.2 and 3.9, with plan sections 4.3 and
# 6.1.1, and with docs/compatibility/surface.yaml, which is the list of endpoints this file must
# cover. tests/unit/test_allowlist.py reads the surface through the surface validator's own parser
# and fails on the sixtieth endpoint the day one is added with no case.
#
# AC-3's floor is ONE CASE PER ENDPOINT - 59 - and 010's own gate measured that floor to be not
# enough: both differences that gate found on /Items/{itemId}/Similar are invisible to a bare
# request, one of them appearing only when `limit` is sent and only for one seed type. So the file
# is the floor, plus the eight L3 rows seeded first, plus the requests the two analysed clients are
# documented as sending, and it grows by measurement rather than by combinatorics - 764 query
# parameters are declared across these 59 operations, which is what makes "one case per parameter"
# not a plan.
#
# THE EIGHT L3 ROWS COME FIRST, and they are the only rows in this repository whose DECLARED
# conformance level nothing has ever checked. surface.yaml carries a `level` on all 59 rows - one
# L1, 50 L2, eight L3 - and L3 is defined in conformance.md as "the response is byte-comparable to
# a real Jellyfin's, modulo a documented allowlist", proven by the differential harness and by
# nothing else. tools/extract_v1_surface.py validates only that the value is one of L0..L3;
# tests/conformance/test_routes.py reads `feature` and `consumers` and never `level`. Meanwhile
# every implemented feature's definition of done ticks "every endpoint reaches the conformance
# level declared in spec section 6" with the differential half deferred to 010. These eight are
# where that debt is paid, so each carries more than one case and every one of them names more
# than one identity.
#
# A CASE THAT ONLY EVER NAMES ONE SEAT IS HOW THIS HARNESS PASSES GREEN WHILE PROVING NOTHING.
# Twelve of the twenty-three reads of this surface answer differently to a restricted
# non-administrator, and two of them differ as SHORTER LISTS rather than as refusals, so nothing
# looks like an error [probe: tools/probe_restricted_surface.py, Jellyfin 10.11.11, 2026-09-01].
# `identities` is where a case says which seats its answer is meaningful for, and the rows that
# name one seat name it for a written reason, given in `what_it_is_for`.
#
# Fields:
#   id            The case name. Unique per endpoint, because the report names a difference by
#                 (endpoint, case, identity) and two cases under one name is one difference
#                 nobody can reproduce. It is also what allowlist.yaml's `case` column narrows an
#                 entry to, so three of the ids here are named by that file and not by this one:
#                 by-name-without-limit, listing-ordered-at-random and
#                 listing-ordered-by-a-key-with-ties. Until they were declared here, two of the
#                 three excused arrays excused nothing on the wire.
#   endpoint      "METHOD /path" from surface.yaml, spelled the way allowlist.yaml spells it.
#   query         The query string, verbatim, or empty. AN EMPTY QUERY IS A VALUE and it is the
#                 commonest one: the AC-3 floor case is a bare request.
#   body          The RAW request body, sent verbatim, or `none`. Verbatim is what lets a
#                 malformed one exist: the named-comparison register's body-binding-dollar-message
#                 row is a case whose body is not JSON at all.
#   content_type  The Content-Type header, or `none` for a case that sends the body WITHOUT ONE.
#                 That is the second of the register's two "here to be recognised, not discovered"
#                 rows: a body with no content type is 400 here and 415 there, on five routes, and
#                 measured on one of them. The other four are cases in this file.
#   anchors       How each path parameter is filled, per server, immediately before the case runs.
#                 NEVER AN IDENTIFIER: the two servers derive those differently by design
#                 (behaviours 1.4), so a case carrying one would compare two different items.
#                 THREE KINDS, where plan 6.1.1 describes one:
#                   listing:<METHOD> <path>#<case>@<position>  the row at that position of that
#                                                              declared listing case - the plan's
#                                                              anchor, and the only sound one over
#                                                              a listing whose ordering is total
#                   response:<METHOD> <path>#<case>@<pointer>  the value at that JSON Pointer of
#                                                              that declared case's response, for
#                                                              the things no listing carries: a
#                                                              created playlist's Id, a negotiated
#                                                              media source's Id
#                   literal:<value>                            a parameter that does not name an
#                                                              item at all - {container},
#                                                              {routeFormat}, {imageType},
#                                                              {imageIndex}, {newIndex}. These are
#                                                              the caller's own choice and are the
#                                                              same string on both servers
#                 `userId` is never an anchor: it is the identity's own (plan 6.1.1).
#   identities    The seats the case is meaningful for, out of administrator, restricted and
#                 playback-denied. An empty list means every identity the run has, which is the
#                 safe direction - the failure this feature is prone to is a case set that names
#                 ONE seat, so the value that says nothing has to mean all of them.
#   needs         What the run must have before the case is askable, from the same vocabulary the
#                 named-comparison register uses. Only `fixture` is used here, and it means what
#                 010 T6 says it means: the anchor wants a kind of item no reachable library has,
#                 so the anchor is left unfilled and T11 fills it against the fixture world D-4
#                 chooses.
#   what_it_is_for  One sentence. It is what review reads when this file grows, and it is where a
#                 case that names one identity says why.
#
# NOTHING HERE IS A WRITE TO AN ACCOUNT THIS PROJECT DOES NOT OWN. Every case that changes user
# data - a configuration, a favourite, a played flag, a playstate report, a playlist - names
# `restricted` alone, because the restricted seat is created and destroyed by the run (AC-15) and
# the administrator's seat is whatever `.env` points at, which on the only reference this project
# could reach before T9 is an operator's own account. Spec 3.5 asks a writing probe to remove what
# it made; this asks the sweep not to make it on somebody else's account in the first place. The
# one exception is the playlist rename, which the reference declares administrator-only, so it
# runs as the administrator over a playlist the restricted seat made.

cases:

  # ==========================================================================================
  # THE EIGHT `level: L3` ROWS OF surface.yaml, FIRST AND PER IDENTITY.
  # ==========================================================================================

  # ------------------------------------------------------------------------------------------
  # GET /System/Info/Public - 001, L3. The one unauthenticated row of the eight.
  # ------------------------------------------------------------------------------------------

  - id: public-system-info
    endpoint: "GET /System/Info/Public"
    query: ""
    body: none
    content_type: none
    anchors: []
    identities: [administrator, restricted]
    needs: []
    what_it_is_for: "The unauthenticated identity document both clients read before anything else; the music client requires its Id to equal AuthenticateByName's ServerId"

  # ------------------------------------------------------------------------------------------
  # POST /Users/AuthenticateByName - 002, L3. The body is the seat's own credentials, which is
  # why the substitution vocabulary exists at all: plan 6.1.1 says userId "is the identity's own"
  # and gives no way to write that down, and no anchor can supply a password.
  # ------------------------------------------------------------------------------------------

  - id: username-and-pw
    endpoint: "POST /Users/AuthenticateByName"
    query: ""
    body: '{"Username": "<identity.username>", "Pw": "<identity.password>"}'
    content_type: application/json
    anchors: []
    identities: [administrator, restricted]
    needs: []
    what_it_is_for: "The two-field body the music client sends, run as each seat: the authentication result nests a user and a session and is the widest single object either server builds"

  # ------------------------------------------------------------------------------------------
  # GET /Items - 005, L3. The most-called endpoint in the surface and the one every anchor
  # indexes, so its cases are both the comparison and the map the rest of the file reads.
  # ------------------------------------------------------------------------------------------

  - id: default
    endpoint: "GET /Items"
    query: ""
    body: none
    content_type: none
    anchors: []
    identities: [administrator, restricted]
    needs: []
    what_it_is_for: "The bare listing, which is AC-3's floor for this endpoint and the shape spec 3.9 measured as answering a SHORTER LIST to a restricted seat rather than a refusal"

  - id: movies-by-sort-name
    endpoint: "GET /Items"
    query: "includeItemTypes=Movie&recursive=true&sortBy=SortName"
    body: none
    content_type: none
    anchors: []
    identities: [administrator, restricted]
    needs: []
    what_it_is_for: "The listing every film anchor indexes: SortName is the one ordering the reference chains a second key after, so position means the same row on both servers"

  - id: series-by-sort-name
    endpoint: "GET /Items"
    query: "includeItemTypes=Series&recursive=true&sortBy=SortName"
    body: none
    content_type: none
    anchors: []
    identities: [administrator, restricted]
    needs: []
    what_it_is_for: "The listing every series anchor indexes, for the two /Shows routes and for the bare-item case that is not a film"

  - id: albums-by-sort-name
    endpoint: "GET /Items"
    query: "includeItemTypes=MusicAlbum&recursive=true&sortBy=SortName"
    body: none
    content_type: none
    anchors: []
    identities: [administrator, restricted]
    needs: []
    what_it_is_for: "The listing every album anchor indexes, for the instant mix and for the images the music client asks an album for"

  - id: audio-by-sort-name
    endpoint: "GET /Items"
    query: "includeItemTypes=Audio&recursive=true&sortBy=SortName"
    body: none
    content_type: none
    anchors: []
    identities: [administrator, restricted]
    needs: []
    what_it_is_for: "The listing every track anchor indexes, for the three audio delivery routes and the user-data routes the music client calls"

  - id: fields-mediasources
    endpoint: "GET /Items"
    query: "Fields=MediaSources"
    body: none
    content_type: none
    anchors: []
    identities: [administrator, restricted]
    needs: []
    what_it_is_for: "What the music client sends on six listing routes, and the request 012's gate measured to be the whole of its negotiation: the listing IS the negotiation there, because that client never calls PlaybackInfo"

  - id: search-term
    endpoint: "GET /Items"
    query: "SearchTerm=a&recursive=true"
    body: none
    content_type: none
    anchors: []
    identities: [administrator, restricted]
    needs: []
    what_it_is_for: "How the music client searches, deliberately instead of /Search/Hints; a relevance ranking goes ahead of every other key on both servers, so this is the one listing whose first key is not a column"

  - id: listing-ordered-at-random
    endpoint: "GET /Items"
    query: "includeItemTypes=Movie&recursive=true&sortBy=Random"
    body: none
    content_type: none
    anchors: []
    identities: [administrator, restricted]
    needs: []
    what_it_is_for: "The case allowlist.yaml's `drawn` entry for a randomly-ordered listing is keyed on; until it was declared that entry excused nothing on the wire. No analysed client sends it - it is declared because Atrium accepts the token and the reference reshuffles per row on every request (behaviours 3.6)"

  - id: listing-ordered-by-a-key-with-ties
    endpoint: "GET /Items"
    query: "includeItemTypes=Audio&recursive=true&sortBy=AlbumArtist"
    body: none
    content_type: none
    anchors: []
    identities: [administrator, restricted]
    needs: []
    what_it_is_for: "The case allowlist.yaml's `unordered` entry is keyed on, and the artist sort is the one behaviours 3.6 measured: the reference adds no key after it, so the concatenation of its pages is not its one-shot list - some rows twice and others never"

  # --- the two listings that name a fixture film, added by 010 T11 --------------------------
  #
  # A GLOBAL LISTING'S FIRST ROW IS NOT A FIXTURE FILM, and until T11 five cases assumed it was.
  # T6 wrote `itemId=listing:GET /Items#movies-by-sort-name@0` under "the fixture is what
  # guarantees the anchored film HAS one", which was true of the world the plan defaulted to - one
  # library, real media throughout. D-4's measurement chose the other branch (010 plan 6.6): BOTH
  # worlds go across, so a movie listing sorted by SortName now spans the 003 tree as well, and
  # its first row is a film of filler bytes with no image, no subtitle stream and nothing a
  # prober can open. Those five cases would have compared two refusals and counted as coverage,
  # which is the same shape as the placeholder item id T6 refused.
  #
  # `searchTerm` is what narrows them, and it is a request a client sends: the music client
  # searches this way deliberately. Each of these names ONE film the fixture declares, so
  # position 0 is that film on both servers.

  - id: the-planted-film
    endpoint: "GET /Items"
    query: "searchTerm=The Planted Poster&includeItemTypes=Movie&recursive=true&sortBy=SortName"
    body: none
    content_type: none
    anchors: []
    identities: [administrator, restricted]
    needs: [fixture]
    what_it_is_for: "The film the artwork cases anchor on: `The Planted Poster (2011)` of tests/fixtures/media.py, which carries a poster with an EXIF orientation and the only Backdrop at index 0 either world has. One name, one row, so position 0 is the same film on both servers"

  - id: the-subtitled-film
    endpoint: "GET /Items"
    query: "searchTerm=The Unconvertible&includeItemTypes=Movie&recursive=true&sortBy=SortName"
    body: none
    content_type: none
    anchors: []
    identities: [administrator, restricted]
    needs: [fixture]
    what_it_is_for: "The film the subtitle cases anchor on: `The Unconvertible (2009)` of tests/fixtures/media.py, which carries an `ass` track inside it and a subtitle file beside it. Without it a subtitle stream at index 0 is a refusal on both servers"

  # ------------------------------------------------------------------------------------------
  # GET /Items/{itemId} - 005, L3. A bare item body carries up to 39 properties a list row does
  # not, so this is the widest per-item comparison in the sweep.
  # ------------------------------------------------------------------------------------------

  - id: a-movie
    endpoint: "GET /Items/{itemId}"
    query: ""
    body: none
    content_type: none
    anchors: ["itemId=listing:GET /Items#movies-by-sort-name@0"]
    identities: [administrator, restricted]
    needs: []
    what_it_is_for: "The full item body of a film, which is the shape 005 T1 measured as being a third thing rather than a wider list row"

  - id: a-series
    endpoint: "GET /Items/{itemId}"
    query: ""
    body: none
    content_type: none
    anchors: ["itemId=listing:GET /Items#series-by-sort-name@0"]
    identities: [administrator, restricted]
    needs: []
    what_it_is_for: "The same body on a container, where the aggregates a film has none of - ChildCount, RecursiveItemCount - are real counts on both servers and are exactly what the allowlist refuses to excuse by name"

  # ------------------------------------------------------------------------------------------
  # POST /Items/{itemId}/PlaybackInfo - 008, L3. Also the home of two of the register's last two
  # rows: the malformed body, and the fourth of the four content-type refusals nobody has asked.
  # ------------------------------------------------------------------------------------------

  - id: no-body
    endpoint: "POST /Items/{itemId}/PlaybackInfo"
    query: ""
    body: none
    content_type: none
    anchors: ["itemId=listing:GET /Items#movies-by-sort-name@0"]
    identities: [administrator, restricted]
    needs: []
    what_it_is_for: "The negotiation with nothing posted, which is a 200 and not a validation failure on both servers because the reference binds the parameter with EmptyBodyBehavior.Allow"

  - id: a-device-profile
    endpoint: "POST /Items/{itemId}/PlaybackInfo"
    query: ""
    body: '{"DeviceProfile": {"MaxStreamingBitrate": 8000000, "TranscodingProfiles": [{"Type": "Video", "Container": "ts", "Protocol": "hls", "VideoCodec": "h264", "AudioCodec": "aac", "EnableSubtitlesInManifest": true}], "DirectPlayProfiles": [{"Type": "Video", "Container": "mp4", "VideoCodec": "h264", "AudioCodec": "aac"}]}}'
    content_type: application/json
    anchors: ["itemId=listing:GET /Items#movies-by-sort-name@0"]
    identities: [administrator, restricted]
    needs: []
    what_it_is_for: "The video client's negotiation, with EnableSubtitlesInManifest on the transcoding profile - the switch 011's gate found the master playlist cannot read, so the delivery address is the only lever"

  - id: malformed-body
    endpoint: "POST /Items/{itemId}/PlaybackInfo"
    query: ""
    body: "not-json"
    content_type: application/json
    anchors: ["itemId=listing:GET /Items#movies-by-sort-name@0"]
    identities: [administrator, restricted]
    needs: []
    what_it_is_for: "The named-comparison register's body-binding-dollar-message row, made an ordinary case: the reference's binder names the whole body `$` in its errors map, and this is the first malformed body a run sends"

  - id: body-with-no-content-type
    endpoint: "POST /Items/{itemId}/PlaybackInfo"
    query: ""
    body: '{"MaxStreamingBitrate": 8000000}'
    content_type: none
    anchors: ["itemId=listing:GET /Items#movies-by-sort-name@0"]
    identities: [administrator, restricted]
    needs: []
    what_it_is_for: "The fourth of the five routes where a body with no Content-Type is 400 here and 415 there; 009 T13 measured the rename and named 010 as the feature that asks the other four"

  # ------------------------------------------------------------------------------------------
  # GET /Audio/{itemId}/stream - 008, L3. Both clients hand-build this URL, and neither sends a
  # token on it: the four stream routes require none, which 008 T6 measured after the task list
  # had said the opposite for three days.
  # ------------------------------------------------------------------------------------------

  - id: static
    endpoint: "GET /Audio/{itemId}/stream"
    query: "static=true"
    body: none
    content_type: none
    anchors: ["itemId=listing:GET /Items#audio-by-sort-name@0"]
    identities: [administrator, restricted]
    needs: []
    what_it_is_for: "The exact URL both analysed clients build by hand for a direct play; the comparison is status, Content-Type, Content-Length and Accept-Ranges, because spec 6 declines to byte-compare produced media"

  - id: no-static
    endpoint: "GET /Audio/{itemId}/stream"
    query: ""
    body: none
    content_type: none
    anchors: ["itemId=listing:GET /Items#audio-by-sort-name@0"]
    identities: [administrator, restricted]
    needs: []
    what_it_is_for: "The same route without the flag, which is the branch that decides a remux against a re-encode; a Range header would be the third reading and no field of a case can carry one yet, which T8 owes"

  # ------------------------------------------------------------------------------------------
  # GET /Audio/{itemId}/universal - 008, L3. The one delivery route that answers 401 without a
  # token, where the four stream routes answer 200.
  # ------------------------------------------------------------------------------------------

  - id: progressive-mp3
    endpoint: "GET /Audio/{itemId}/universal"
    query: "container=mp3&transcodingContainer=mp3&transcodingProtocol=http&audioCodec=mp3&maxStreamingBitrate=192000&playSessionId=atrium-differential"
    body: none
    content_type: none
    anchors: ["itemId=listing:GET /Items#audio-by-sort-name@0"]
    identities: [administrator, restricted]
    needs: []
    what_it_is_for: "The progressive MP3 the music client asks for on every capped quality tier, with the deterministic playSessionId that client sends; its HLS variant has been dormant on the client side since 2026-08-03"

  - id: no-parameters
    endpoint: "GET /Audio/{itemId}/universal"
    query: ""
    body: none
    content_type: none
    anchors: ["itemId=listing:GET /Items#audio-by-sort-name@0"]
    identities: [administrator, restricted]
    needs: []
    what_it_is_for: "The bare call, where the container is inferred from a URL with no extension - the branch 008 T8 found a faithful profile transcription would have got wrong"

  # ------------------------------------------------------------------------------------------
  # GET /Videos/{itemId}/stream - 008, L3.
  # ------------------------------------------------------------------------------------------

  - id: static
    endpoint: "GET /Videos/{itemId}/stream"
    query: "static=true"
    body: none
    content_type: none
    anchors: ["itemId=listing:GET /Items#movies-by-sort-name@0"]
    identities: [administrator, restricted]
    needs: []
    what_it_is_for: "The URL the video client builds by hand for a direct play, with the lower-camel mediaSourceId and api_key spellings that client's contract fixes"

  - id: a-wrong-container
    endpoint: "GET /Videos/{itemId}/stream"
    query: "static=true&container=mkv"
    body: none
    content_type: none
    anchors: ["itemId=listing:GET /Items#movies-by-sort-name@0"]
    identities: [administrator, restricted]
    needs: []
    what_it_is_for: "static=true on a container the source is not, which 008's gate measured to be the original bytes behind a lying label rather than an error - a claim the spec's error table had made up"

  # ==========================================================================================
  # THE FLOOR: the other 51 endpoints of surface.yaml, in the file's own order, plus the cases
  # the two analysed clients are documented as sending and the four the register owes.
  # ==========================================================================================

  # --- 001 ----------------------------------------------------------------------------------

  - id: system-info
    endpoint: "GET /System/Info"
    query: ""
    body: none
    content_type: none
    anchors: []
    identities: [administrator, restricted]
    needs: []
    what_it_is_for: "The authenticated identity document, read by the music client for LocalAddress and for a ProductName that must contain jellyfin; seven of its installation paths differ on every run and are triage rather than allowlist rows"

  - id: ping
    endpoint: "GET /System/Ping"
    query: ""
    body: none
    content_type: none
    anchors: []
    identities: [administrator, restricted]
    needs: []
    what_it_is_for: "The smallest body either server sends, and the one case where a difference can only be the serialisation itself"

  - id: ping
    endpoint: "POST /System/Ping"
    query: ""
    body: none
    content_type: none
    anchors: []
    identities: [administrator, restricted]
    needs: []
    what_it_is_for: "The same answer under the other method, which is the pair that proves a method is routed rather than tolerated"

  # --- 002 ----------------------------------------------------------------------------------

  - id: public-users
    endpoint: "GET /Users/Public"
    query: ""
    body: none
    content_type: none
    anchors: []
    identities: [administrator, restricted]
    needs: []
    what_it_is_for: "The unauthenticated user list, which 002 T11 measured as sending every user's full policy and configuration to a caller with no token"

  - id: me
    endpoint: "GET /Users/Me"
    query: ""
    body: none
    content_type: none
    anchors: []
    identities: [administrator, restricted]
    needs: []
    what_it_is_for: "The caller's own record, and the one read spec 3.9 measured as A NARROWER OBJECT rather than a shorter list: twelve properties to an administrator and ten to everybody else"

  - id: the-identitys-own
    endpoint: "GET /Users/{userId}"
    query: ""
    body: none
    content_type: none
    anchors: []
    identities: [administrator, restricted]
    needs: []
    what_it_is_for: "userId is never an anchor - it is the identity's own (plan 6.1.1). A case naming ANOTHER user's id belongs to a named comparison and not to the sweep, which is what 002's 2026-09-01 fix withdrew a 403 over"

  - id: replace-configuration
    endpoint: "POST /Users/Configuration"
    query: ""
    body: '{"PlayDefaultAudioTrack": true, "RememberAudioSelections": true, "SubtitleMode": "Default"}'
    content_type: application/json
    anchors: []
    identities: [restricted]
    needs: []
    what_it_is_for: "The restricted seat alone: this route REPLACES the caller's configuration rather than merging it, and the only account a run may overwrite is the one it created and destroys"

  - id: full-capabilities
    endpoint: "POST /Sessions/Capabilities/Full"
    query: ""
    body: '{"PlayableMediaTypes": ["Audio", "Video"], "SupportsMediaControl": false, "SupportsPersistentIdentifier": false}'
    content_type: application/json
    anchors: []
    identities: [administrator, restricted]
    needs: []
    what_it_is_for: "The capabilities a client posts once per session; it replaces rather than merges, but what it replaces is the run's own session and not an operator's account"

  - id: own-sessions
    endpoint: "GET /Sessions"
    query: ""
    body: none
    content_type: none
    anchors: []
    identities: [administrator, restricted]
    needs: []
    what_it_is_for: "One of the twelve reads that answers a SHORTER LIST to a restricted seat: an administrator sees every session and everybody else sees their own"

  - id: video-client-device-id
    endpoint: "GET /Sessions"
    query: "deviceId=atrium-differential"
    body: none
    content_type: none
    anchors: []
    identities: [administrator, restricted]
    needs: []
    what_it_is_for: "The one concrete query string the video client's contract gives, and a parameter neither server's route declares - so it is an ignored-parameter reading as well as a comparison"

  # --- 004 ----------------------------------------------------------------------------------

  - id: cultures
    endpoint: "GET /Localization/Cultures"
    query: ""
    body: none
    content_type: none
    anchors: []
    identities: [administrator, restricted]
    needs: []
    what_it_is_for: "The 192-row culture table 004 T15 rebuilt after the registry the plan named turned out to have 508 rows, a reversed code order and eight rows it cannot produce at all"

  # --- 005 ----------------------------------------------------------------------------------

  - id: views
    endpoint: "GET /UserViews"
    query: ""
    body: none
    content_type: none
    anchors: []
    identities: [administrator, restricted]
    needs: []
    what_it_is_for: "The endpoint whose ChildCount is a fresh random integer on every request on the reference, excused on this row and nowhere else; also one of the twelve reads that shortens for a restricted seat"

  - id: latest
    endpoint: "GET /Items/Latest"
    query: ""
    body: none
    content_type: none
    anchors: []
    identities: [administrator, restricted]
    needs: []
    what_it_is_for: "A bare array rather than an envelope, which is why the allowlist carries a whole second family of pointers spelled /-/Id"

  - id: filters
    endpoint: "GET /Items/Filters"
    query: ""
    body: none
    content_type: none
    anchors: []
    identities: [administrator, restricted]
    needs: []
    what_it_is_for: "The legacy filter shape, whose arrays are the library's own vocabulary and therefore the sharpest fixture-driven comparison in the sweep"

  - id: a-movie-seed
    endpoint: "GET /Items/{itemId}/Similar"
    query: ""
    body: none
    content_type: none
    anchors: ["itemId=listing:GET /Items#movies-by-sort-name@0"]
    identities: [administrator, restricted]
    needs: []
