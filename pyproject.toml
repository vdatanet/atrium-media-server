# SPDX-License-Identifier: GPL-3.0-or-later
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atrium-media-server"
description = "A media server for movies, series and music that speaks the Jellyfin API."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dynamic = ["version"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]

# Only what feature 001 actually uses. Later features add their own, so the dependency set
# always says what the code needs rather than what the roadmap intends.
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "fastapi>=0.115",
    # Embedded audio tags: ID3, Vorbis comments, MP4 atoms - every container 003 admits. Pure
    # Python, mature, and it exposes multi-valued frames as lists and embedded art as bytes, which
    # is what AC-6 is about. The alternative was shelling to `ffprobe`, rejected in 004 plan
    # section 10: a subprocess per file inside the scan's hot path, and its tag output joins
    # multi-values into one string - destroying the thing AC-6 exists to keep. GPL-2.0-or-later,
    # compatible with this project's GPL-3.0-or-later.
    "mutagen>=1.47",
    # Image dimensions at association time. `PrimaryImageAspectRatio` needs width and height
    # (005 section 3.2), and an association row without them makes an item's aspect ratio
    # silently absent. 006 needs Pillow anyway for resizing, so this is the same dependency
    # arriving one feature early - and it is used here for **header reads only**: `Image.open`
    # parses enough to report a size and never decodes a pixel.
    # The two remote providers, used synchronously (004 plan section 6.8). It was already in the
    # dev group for FastAPI's test client, so promoting it beats carrying a second HTTP client -
    # and having exactly one means `metadata/remote.py` can be the only module that constructs a
    # client, which is what makes "no test reaches the network" enforceable by construction rather
    # than by discipline.
    "httpx>=0.28",
    "pillow>=11.0",
    "pydantic>=2.10",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.34",
]

# Deferred from T1, when `atrium.server` did not exist yet: an entry point pointing at a missing
# module fails the build, and a broken one is worse than none.
[project.scripts]
atrium = "atrium.server:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "mypy>=1.14",
    # The naming corpus (tests/corpus/naming.yaml) is a table of several dozen rows that each
    # carry a sentence of prose saying why they exist. JSON has no comments and TOML has no
    # comfortable shape for a list of heterogeneous records, and the reasons are the part of that
    # file most likely to be read. A dev dependency only: nothing the server ships parses YAML.
    "pyyaml>=6.0",
]

[tool.hatch.version]
path = "src/atrium/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/atrium"]

# --------------------------------------------------------------------------------------------
# Lint
# --------------------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
src = ["src", "tests", "tools"]
target-version = "py312"
# Markdown is documentation, not code. Recent ruff versions will reformat fenced Python blocks
# inside it, which silently rewrites reviewed prose - the aligned comment columns in the plans are
# a deliberate readability choice, not un-formatted code. Keep the formatter about code.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # import sorting
    "N",           # pep8-naming
    "UP",          # pyupgrade
    "B",           # bugbear
    "A",           # shadowed builtins
    "C4",          # comprehensions
    "DTZ",         # naive datetimes - this project has exactly one date format and it is aware
    "T20",         # no print() in the package
    "S",           # flake8-bandit - enabled at the skeleton, when the noise is three findings
    "SIM",         # simplification
    "PTH",         # pathlib over os.path
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# Probes and tools are command-line programs whose output IS the product, and they carry a Python
# 3.9 floor (see tools/README.md) so they cannot use 3.11+ spellings the pyupgrade rules prefer.
"tools/*" = ["T20", "UP017", "UP045", "UP007"]
# Tests assert on values that would otherwise look like magic numbers, and asserting on a
# hardcoded test password is the entire point of tests/security.
"tests/*" = ["N802", "S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["atrium"]

# --------------------------------------------------------------------------------------------
# Types
# --------------------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
# Strict from the first commit, not retrofitted: on a codebase whose job is getting field types
# exactly right, gradual typing leaves the errors that matter most unchecked. ADR-0002.
warn_unreachable = true
warn_no_return = true
disallow_any_unimported = true

# --------------------------------------------------------------------------------------------
# Tests
# --------------------------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -q"
# A warning nobody sees is a warning nobody fixes, and the first one to matter here was a
# deprecated test client reaching a code path the server never uses.
filterwarnings = ["error"]
asyncio_mode = "auto"
markers = [
    "conformance: asserts behaviour at the HTTP boundary (Principle VIII)",
    # Carried by exactly one test since 004 T14: the live provider replay of plan section 8. It
    # exists so the network guard in tests/conftest.py has an exit that is declared rather than
    # improvised, and so feature 010's differential harness has one waiting.
    "needs_reference: needs a reachable reference service - a Jellyfin server, or the online metadata providers 004 uses. Exempt from the no-network guard, skipped by default, never in CI",
]
