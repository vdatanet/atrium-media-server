#
# For running Alembic by hand during development:
#
#     uv run alembic revision --autogenerate -m "what it does"
#     uv run alembic upgrade head
#
# The server does not read this file. It builds the same configuration in `atrium.db.schema`, so
# that a running instance and a command line always agree about which database is being migrated -
# see the note in migrations/env.py about why no URL appears here.

[alembic]
script_location = src/atrium/db/migrations
prepend_sys_path = src
path_separator = os
